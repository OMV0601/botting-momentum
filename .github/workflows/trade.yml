name: daily rebalance

# Rebalances the Alpaca paper account to strategy.py's target, once per
# trading day at the open. Places orders only when:
#   - fired by the external clock (repository_dispatch "trade-at-open"), or
#   - run by hand with "execute" ticked.
# A manual run without "execute" is a dry run: it prints the plan, sends
# nothing. Nothing fires on a schedule until the external clock is set up.
# Halt without a code change: set the TRADING_ENABLED variable to "false",
# or commit a file named HALT to the repo root.

on:
  repository_dispatch:
    types: [trade-at-open]

  workflow_dispatch:
    inputs:
      execute:
        description: "Place real paper orders (unchecked = dry run)"
        type: boolean
        default: false
      force:
        description: "Ignore the once-per-day gate"
        type: boolean
        default: false

concurrency:
  group: trade
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebalance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the open, or skip
        id: gate
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 market_wait.py \
            --until open \
            --max-wait-min 25 \
            --grace-sec 45 \
            --state state/last_run.json

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Preflight
        if: steps.gate.outputs.run == 'true'
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_ACCOUNT_ID: ${{ vars.ALPACA_ACCOUNT_ID || secrets.ALPACA_ACCOUNT_ID || '' }}
          ALPACA_LIVE: ${{ vars.ALPACA_LIVE || secrets.ALPACA_LIVE || '' }}
          MAX_DEPLOY: ${{ vars.MAX_DEPLOY || secrets.MAX_DEPLOY || '' }}
        run: python preflight.py

      - name: Rebalance
        if: steps.gate.outputs.run == 'true'
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_ACCOUNT_ID: ${{ vars.ALPACA_ACCOUNT_ID || secrets.ALPACA_ACCOUNT_ID || '' }}
          ALPACA_LIVE: ${{ vars.ALPACA_LIVE || secrets.ALPACA_LIVE || '' }}
          TRADING_ENABLED: ${{ vars.TRADING_ENABLED || 'true' }}
          DATA_SOURCE: ${{ vars.DATA_SOURCE || 'yahoo' }}
          MAX_DEPLOY: ${{ vars.MAX_DEPLOY || secrets.MAX_DEPLOY || '' }}
          MIN_COVERAGE: ${{ vars.MIN_COVERAGE || '0.95' }}
          YF_BATCH: ${{ vars.YF_BATCH || '100' }}
          YF_PAUSE: ${{ vars.YF_PAUSE || '2.0' }}
          YF_THREADS: ${{ vars.YF_THREADS || 'false' }}
          YF_ATTEMPTS: ${{ vars.YF_ATTEMPTS || '5' }}
          YF_BACKOFF: ${{ vars.YF_BACKOFF || '30' }}
          STALE_AFTER_DAYS: ${{ vars.STALE_AFTER_DAYS || '2' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_TO: ${{ vars.NOTIFY_TO }}
          NOTIFY_FROM: ${{ vars.NOTIFY_FROM }}
        run: |
          FLAGS=""
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            FLAGS="--execute"
          else
            if [ "${{ inputs.execute }}" = "true" ]; then
              FLAGS="--execute"
            fi
            if [ "${{ inputs.force }}" = "true" ]; then
              FLAGS="$FLAGS --force"
            fi
          fi
          echo "run_daily.py $FLAGS"
          python run_daily.py $FLAGS

      - name: Commit journal and run state
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          git config user.name  "trading-bot"
          git config user.email "actions@github.com"
          git add journal.md state/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            for i in 1 2 3; do
              git push && break || { echo "push failed, retry $i"; sleep $((i*5)); git pull --rebase --autostash; }
            done
          fi
